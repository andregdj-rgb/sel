<style>

 --surf:#1e1b28;--row:#191722;--ctrl:#ffffff08;--input:#15131c;

 --bg:#0a1931;--g1:#2c63d955;--g2:#17a99a38;
 --surf:#112548d9;--row:#0d1f3ecc;--ctrl:#ffffff0a;--input:#0b1b36;

 --brand1:#d6ecff;--brand2:#86cdff;--ring1:#a8f0de;--ring2:#7ab9ff}

 --bg:#0c171a;--g1:#1c4d5640;--g2:#4a42222a;
 --surf:#132226;--row:#0f1c1f;--input:#0c1719;
 --track:#21363b;--heat0:#152629;--heatE:#1d3236;
 --tx:#e9f3f1;--mu:#93aaa8;--on:#0c1719;
 --nav-bg:#0f1c1fef;--sheet:#152629;--scrim:#04090ab8;--tipbg:#1d3236;
 --c0:#5fd3c3;--c1:#a3b6ff;--c2:#ecc57e;--c3:#f39d8d;--c4:#7fc6e8;--c5:#9cd6a2;--c6:#f2b28c;--cx:#f0d58c;

 --bg:#f4efe7;--g1:#ffd6a62e;--g2:#b6e1d93a;
 --surf:#fffdf9;--row:#f7f2eb;--ctrl:#2a201808;--input:#f8f4ee;
 --hair:#2a201812;--hair2:#2a201822;--track:#e6dfd3;--heat0:#ece6dc;--heatE:#e2d9cb;

 --brand1:#7a4f19;--brand2:#be9418;--ring1:#e7b748;--ring2:#c68619}

 --bg:#080a11;--g1:#241d4a55;--g2:#0f3a4455;
 --surf:#161a2b;--row:#0b0e1a;--input:#0d1020;
 --hair:#ffffff10;--hair2:#ffffff1c;--track:#1d2338;--heat0:#141a2c;--heatE:#1d2440;

 --c0:#3dd6c6;--c1:#9b8cff;--c2:#ffb454;--c3:#ff6f91;--c4:#6fb7ff;--c5:#8fe388;--c6:#ff9b6b;--cx:#f5d26b;
 --brand1:#f6efe0;--brand2:#f5d26b;--ring1:#ffe9a8;--ring2:#e8a94a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
html.lg body{zoom:1.12}
body{color:var(--tx);font-family:var(--font);font-weight:var(--fw-r);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none;
 background:radial-gradient(700px 440px at 92% -8%,var(--g1) 0,transparent 62%),radial-gradient(620px 440px at -5% 108%,var(--g2) 0,transparent 62%),var(--bg);background-attachment:fixed;transition:background-color .3s,color .3s}
button{font:inherit;font-family:var(--font);cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:4;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px)}
.tin{max-width:600px;margin:0 auto}
.r1{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--font-h);font-weight:var(--wn);font-size:calc(21px*var(--hs));line-height:1.1;letter-spacing:-.005em;background:linear-gradient(90deg,var(--brand1),var(--brand2) 75%);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
.dnav{display:flex;align-items:center;gap:8px;margin-top:10px}
.dt{flex:1;text-align:center;font-family:var(--font-h);font-weight:var(--wh);font-size:calc(18px*var(--hs));line-height:1.15}
.dt small{display:block;font:var(--fw-m) 11.5px var(--font);color:var(--mu);margin-top:2px;letter-spacing:.02em}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair2);background:var(--ctrl);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;font-size:22px;flex:none;transition:background .15s}
.ib:active{background:var(--hair2)}
.ib:disabled{opacity:.25}
.tdy{font-size:12.5px;font-weight:var(--fw-b);padding:0 14px;width:auto;border-radius:22px}
main{max-width:600px;margin:0 auto;padding:4px 16px calc(var(--nav) + env(safe-area-inset-bottom,0px) + 28px);touch-action:pan-y}
.stabs{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;margin:12px -16px 0;padding:8px 16px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;
 background:linear-gradient(to top,color-mix(in srgb,var(--ac) 65%,transparent) 0 1.5px,transparent 1.5px)}
.stabs::-webkit-scrollbar{display:none}
.st{position:relative;flex:none;display:flex;align-items:center;gap:7px;padding:8px 15px;border:1px solid var(--hair2);border-bottom:0;border-radius:15px 15px 0 0;
 background:var(--row);color:var(--mu);font-size:13.5px;font-weight:var(--fw-m);white-space:nowrap;transition:background .2s,color .2s,padding .2s}
.st::after{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:color-mix(in srgb,var(--ac) 65%,transparent)}
.st i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--c);flex:none}
.st i.full{background:var(--c)}
.st.on{color:var(--tx);padding:11px 17px 10px;z-index:1;font-weight:var(--fw-b);
 background:linear-gradient(180deg,color-mix(in srgb,var(--c) 24%,var(--surf)),color-mix(in srgb,var(--c) 9%,var(--surf)));
 border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:inset 0 2.5px 0 0 var(--c),0 -6px 18px -10px color-mix(in srgb,var(--c) calc(var(--glow)*100%),transparent)}
.st.on::after{display:none}
.view.sec .card:first-child,.view.sec>.banner+.card{margin-top:16px}
.view.sec{animation:vin .2s ease-out}
.view{animation:vin .24s ease-out}@keyframes vin{from{opacity:0;transform:translateY(6px)}}
.sL{animation:sL .24s ease-out}@keyframes sL{from{opacity:.2;transform:translateX(28px)}}
.sR{animation:sR .24s ease-out}@keyframes sR{from{opacity:.2;transform:translateX(-28px)}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav-bg);backdrop-filter:blur(18px);border-top:1px solid var(--hair);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabsin{max-width:600px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--mu);font-size:11.5px;font-weight:var(--fw-m);background:none;border:0}
.tab .pb{padding:5px 20px;border-radius:18px;display:flex;transition:background .2s}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--tx)}.tab.on .pb{background:color-mix(in srgb,var(--cx) 22%,transparent);color:var(--cx)}
.card{--c:var(--c0);background:var(--surf);border:1px solid var(--hair);border-radius:26px;padding:18px 16px;margin:14px 0;box-shadow:var(--shadow),inset 0 1px 0 var(--hair)}
.hero{display:flex;align-items:center;gap:20px}
.big{font-family:var(--font-h);font-weight:var(--wn);font-size:calc(32px*var(--hs));line-height:1.05;letter-spacing:-.01em}
.tag{font:var(--fw-b) 12.5px var(--font);color:var(--c);letter-spacing:.02em}
.hint{color:var(--mu);font-size:13px;line-height:1.45}
.ch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:0 2px}
.nm{font-family:var(--font-h);font-weight:var(--wh);font-size:calc(19px*var(--hs));line-height:1.2;margin-top:1px}
.ch .p{color:var(--c);font-family:var(--font-h);font-weight:var(--wn);font-size:calc(20px*var(--hs))}
.chev{color:var(--mu);font-size:18px;transition:transform .2s;transform:rotate(-90deg);width:22px;text-align:center}.chev.open{transform:none}
.bar{height:6px;background:var(--track);border-radius:6px;overflow:hidden;margin:12px 2px 8px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.3,.8,.3,1);background:var(--c)}
.row{display:flex;align-items:center;gap:13px;min-height:60px;padding:9px 4px 9px 14px;margin:7px 0;border-radius:20px;background:var(--row);border:1px solid var(--hair);position:relative;overflow:hidden;cursor:pointer;user-select:none;transition:transform .12s,background .2s;width:100%;color:var(--tx);text-align:left}
.row:active{transform:scale(.985)}
.row.d{background:color-mix(in srgb,var(--c) 9%,var(--row))}
.ck{width:28px;height:28px;border-radius:50%;border:2.2px solid color-mix(in srgb,var(--c) 85%,transparent);flex:none;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.row.d .ck{background:var(--c);border-color:var(--c);box-shadow:0 0 calc(12px*var(--glow)) -2px var(--c)}
.row.d .ck::after{content:'';width:6px;height:11px;border:solid var(--on);border-width:0 2.6px 2.6px 0;border-radius:1px;transform:translateY(-1px) rotate(45deg)}
.row.pop .ck{animation:pop .36s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{40%{transform:scale(1.28)}}
.row.d .lb{color:color-mix(in srgb,var(--tx) 62%,transparent)}
.lbw{flex:1;min-width:0}
.lb{font-size:15.5px;font-weight:var(--fw-m);line-height:1.3}
.meta{display:flex;gap:10px;align-items:center;margin-top:5px;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.mini{display:flex;gap:3.5px}
.mini i{width:6px;height:6px;border-radius:50%;background:var(--track);display:block}
.mini i.on{background:var(--c)}
.mini i.now{outline:1.5px solid var(--mu);outline-offset:1px}
.mo{width:44px;height:44px;border-radius:50%;color:var(--mu);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:none;border:0}
.f{position:absolute;left:0;bottom:0;height:3px;border-radius:0 3px 3px 0;background:var(--c)}
.add{justify-content:center;border-style:dashed;border-color:var(--hair2);background:none;color:var(--mu);min-height:48px;font-weight:var(--fw-m)}
.addg{display:flex;width:100%;align-items:center;justify-content:center;min-height:56px;margin:14px 0;border:1.5px dashed var(--hair2);border-radius:26px;color:var(--mu);background:none;font-weight:var(--fw-m)}
.stp{display:flex;align-items:center;gap:6px;flex:none}
.sb{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair2);background:var(--ctrl);color:var(--tx);font-size:21px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.sb:active{background:color-mix(in srgb,var(--c) 30%,transparent)}
.sn{min-width:20px;text-align:center;color:var(--c);font-weight:var(--fw-x)}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border-radius:18px;padding:8px 0 7px;text-align:center;background:var(--row);border:1px solid var(--hair);color:var(--tx);font-weight:var(--fw-b)}
.wd.sel{border-color:var(--cx);background:color-mix(in srgb,var(--cx) 14%,var(--row))}
.wd:disabled{opacity:.35}
.wd small{display:block;font-size:11px;font-weight:var(--fw-m);color:var(--mu)}
.wd svg{width:30px;height:30px;display:block;margin:4px auto 0}
.mc{padding:14px 2px;border-bottom:1px solid var(--hair)}.mc:last-of-type{border-bottom:0}
.mh{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.mh b{font-weight:var(--fw-b);font-size:16px}.mh span{color:var(--mu);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{height:48px;border-radius:16px;border:1px solid var(--hair2);background:var(--ctrl);color:var(--mu);font-size:17px;font-weight:var(--fw-b);transition:background .15s,transform .15s}
.scale button.on{background:var(--c);color:var(--on);border-color:var(--c);transform:scale(1.04);box-shadow:0 0 calc(14px*var(--glow)) -3px var(--c)}
.numin{display:flex;align-items:center;gap:8px}
.numin input{flex:1;text-align:center;font-size:18px;font-weight:var(--fw-b)}
input[type=number],input[type=text],textarea,select{background:var(--input);color:var(--tx);border:1px solid var(--hair2);border-radius:14px;padding:11px 13px;font:inherit;font-family:var(--font);font-size:16px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--c,var(--c0)) 60%,transparent);outline-offset:1px}
select{width:auto}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.seg{display:flex;background:var(--row);border-radius:16px;padding:4px;border:1px solid var(--hair);gap:2px}
.seg button{flex:1;background:none;border:0;color:var(--mu);padding:9px 6px;border-radius:12px;font-size:13px;font-weight:var(--fw-b);white-space:nowrap}
.seg button.on{background:var(--surf);color:var(--tx);box-shadow:0 2px 8px -4px #0006}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--hair2);background:none;color:var(--mu);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:var(--fw-m)}
.chips button.on{border-color:var(--c4);color:var(--tx);background:color-mix(in srgb,var(--c4) 16%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--row);border:1px solid var(--hair);border-radius:20px;padding:13px 11px}
.tile b{display:block;font-family:var(--font-h);font-weight:var(--wn);font-size:calc(26px*var(--hs));line-height:1}
.tile span{display:block;font-size:11.5px;color:var(--mu);margin-top:7px;line-height:1.3}
.chart{position:relative;padding-top:42px;margin:4px 0 2px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--mu);font-family:var(--font)}
.chart .gl{stroke:var(--hair2)}
.tip{position:absolute;top:0;transform:translateX(-50%);pointer-events:none;background:var(--tipbg);color:#f3eff7;border-radius:12px;padding:6px 10px;font-size:12px;white-space:nowrap;display:none;font-variant-numeric:tabular-nums;line-height:1.35}
.heatw{overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.heat{display:flex;gap:3px}
.hcol{display:flex;flex-direction:column;gap:3px}
.hc{border-radius:5px;background:var(--heat0);cursor:pointer;border:1.5px solid transparent;padding:0}
.hc.na{background:transparent;cursor:default}
.hc.sel{border-color:var(--tx)}
.pr{display:grid;grid-template-columns:1fr 50px 76px;gap:8px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--hair);cursor:pointer}
.pr.h{cursor:default;font-size:11.5px;font-weight:var(--fw-b);color:var(--mu);padding-top:2px}
.pr .num{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:var(--fw-b)}
.pr .mu{color:var(--mu);font-weight:var(--fw-m)}
.rb{height:5px;background:var(--track);border-radius:5px;margin-top:7px;overflow:hidden}.rb i{display:block;height:100%;border-radius:5px}
.cmp{padding:11px 2px;border-bottom:1px solid var(--hair)}
.cmp .t1{display:flex;gap:8px;font-size:14px;font-weight:var(--fw-m)}.cmp .t1 span{margin-left:auto;color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:var(--fw-m)}
.dv{position:relative;height:8px;margin-top:8px;background:var(--track);border-radius:4px}
.dv::before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--mu);opacity:.6}
.dv i{position:absolute;top:0;bottom:0;border-radius:4px}
.empty{text-align:center;padding:28px 12px;color:var(--mu)}
.set{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;padding:8px 14px;margin:7px 0;border-radius:18px;background:var(--row);border:1px solid var(--hair);color:var(--tx);text-align:left;font-weight:var(--fw-m)}
.set span{flex:1}.set em{font-style:normal;color:var(--mu);font-weight:var(--fw-m)}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 4px}
.th{border-radius:20px;padding:12px;border:2px solid transparent;text-align:left;background:var(--tbg);color:var(--ttx);position:relative}
.th.on{border-color:var(--cx)}
.th b{display:block;font-size:15px;margin-bottom:2px}.th small{display:block;font-size:11.5px;opacity:.7;margin-bottom:8px}
.th .sws{display:flex;gap:4px}.th .sws i{width:16px;height:16px;border-radius:50%}
#bd{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s;z-index:8}
#bd.on{opacity:1;pointer-events:auto}
#sh{--c:var(--c0);position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:90vh;overflow:auto;background:var(--sheet);border-top:1px solid var(--hair2);border-radius:30px 30px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto;box-shadow:0 -20px 50px -20px #0008}
#sh.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--hair2);margin:0 auto 14px}
#sh h3{margin:4px 0 12px;font-family:var(--font-h);font-weight:var(--wn);font-size:calc(24px*var(--hs));line-height:1.15}

 else if(kind==='flower'){const u='pf'+(patN++);const R=mini?11:34,dx=R,dy=R*Math.sqrt(3)/2*2/2;let o='';const rows=Math.ceil(H/(R*0.866))+2,cols=Math.ceil(W/R)+2;

  g=`<defs><radialGradient id="${u}g" cx="${mini?.5:.88}" cy="${mini?.5:.05}" r="${mini?.7:.95}"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="${u}m"><rect width="${W}" height="${H}" fill="url(#${u}g)"/></mask></defs><g mask="url(#${u}m)" fill="none" style="stroke:var(--c1)" stroke-width="${mini?.6:.8}" opacity="${mini?.8:.24}">${o}</g>`}

  g=mini?blob(W*.5,H*.55,W*.6,6,1,c[0],.9):blob(W*.9,H*.1,Math.max(W,H)*.55,14,1.1,c[0],.2)+blob(W*.05,H*.92,Math.max(W,H)*.4,10,2.4,c[1],.17)}
 else if(kind==='waves'){const n=mini?6:Math.ceil(H/26);for(let k=0;k<n;k++){const y0=(k+.5)*H/n,A=(mini?2:7)+(mini?1.5:6)*Math.sin(k*.7),f=(mini?3:1.4)*Math.PI*2/W,ph=k*.9;let d='';for(let x=0;x<=W;x+=W/60)d+=(x?'L':'M')+x.toFixed(1)+' '+(y0+A*Math.sin(f*x+ph)+(mini?0:4*Math.sin(f*2.3*x-ph))).toFixed(1);

const isDone=(it,v)=>it.type==='num'?(+v||0)>=(+it.target||1):!!v;

function weekCount(id,s){const w=wkStart(s);let n=0;for(let k=0;k<7;k++)n+=+val(addD(w,k),id)||0;return n}

function vWeek(){

  secs:groups('weekly').map(g=>{const p=g.items.length?avg(g.items.map(i=>wItemPct(i,sel))):0;return {id:g.id,label:g.name,c:g.color,full:p>=1,html:()=>gCard(g,p,wRow)}}),

function spark(id){
 const pts=[];for(let k=27;k>=0;k--){const v=metric(addD(sel,-k),id);if(v!=null)pts.push([27-k,v])}
 if(pts.length<2)return '';
 const ys=pts.map(p=>p[1]);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi===lo){hi+=1;lo-=1}
 const P=pts.map(([x,y])=>[(x/27*196+2).toFixed(1),(22-(y-lo)/(hi-lo)*20).toFixed(1)]);
 return `<svg viewBox="0 0 200 24" style="width:100%;height:24px;margin-top:10px;display:block"><polyline fill="none" stroke="var(--c4)" stroke-width="1.6" stroke-linejoin="round" points="${P.map(p=>p.join(',')).join(' ')}"/><circle cx="${P[P.length-1][0]}" cy="${P[P.length-1][1]}" r="2.4" fill="var(--c4)"/></svg>`}
function vCheck(){
 const x=peek(sel)||{},m=x.m||{};
 const rows=ST.cfg.metrics.map(mt=>{const v=m[mt.id];
  const l7=[];for(let k=0;k<7;k++){const q=metric(addD(sel,-k),mt.id);if(q!=null)l7.push(q)}
  const inp=mt.type==='scale'?`<div class="scale">${[1,2,3,4,5].map(k=>`<button class="${+v===k?'on':''}" onclick="setM('${mt.id}',${k},true)">${k}</button>`).join('')}</div>`
   :`<div class="numin"><button class="sb" onclick="stepM('${mt.id}',-1)">−</button><input type="number" inputmode="decimal" step="${mt.step||'any'}" value="${v===undefined?'':esc(Math.round(+v*100)/100)}" placeholder="${esc(mt.unit||'')}" onchange="setM('${mt.id}',this.value===''?undefined:+this.value)"><button class="sb" onclick="stepM('${mt.id}',1)">+</button></div>`;
  return `<div class="mc"><div class="mh"><b>${esc(mt.label)}</b><small class="hint">${mt.type==='scale'?'1–5':esc(mt.unit||'')}</small><span>${l7.length?'7-day avg '+fmN(Math.round(avg(l7)*10)/10):''}</span></div>${inp}${spark(mt.id)}</div>`}).join('');
 const done=Object.keys(m).filter(k=>ST.cfg.metrics.some(mm=>mm.id===k)).length;
 const ci=`<section class="card" style="--c:var(--c4)"><div class="ch" style="cursor:default"><div style="flex:1"><div class="tag">Check-in</div><div class="nm">How you are ${sel===today()?'today':'on this day'}</div></div><span class="p">${done}/${ST.cfg.metrics.length}</span></div><div class="bar"><i style="width:${ST.cfg.metrics.length?done/ST.cfg.metrics.length*100:0}%"></i></div>${rows}<button class="row add" onclick="openMetrics()">＋ Add / edit check-in fields</button></section>`;
 const notes=`<section class="card" style="--c:var(--c1)"><div class="tag">Notes</div><div class="nm" style="margin-bottom:10px">Observations</div><textarea placeholder="What helped, what got in the way, how voice / posture / eyes felt…" onchange="setNote(this.value)">${esc(x.n||'')}</textarea></section>`;
 return {secs:[{id:'ci',label:'Check-in',c:'--c4',full:done===ST.cfg.metrics.length&&done>0,html:()=>ci},{id:'notes',label:'Notes',c:'--c1',full:!!x.n,html:()=>notes}]}}

/* ---------- charts ---------- */
const CH={};let chN=0;
const chartW=()=>Math.max(260,Math.min((($('main').clientWidth||380)-30-2),560));
function roll(vals,k=7){return vals.map((_,i)=>{const w=vals.slice(Math.max(0,i-k+1),i+1).filter(v=>v!=null);return w.length?avg(w):null})}
function lineChart(o){
 const id='ch'+(chN++),W=chartW(),H=170,pl=34,pr=10,pt=8,pb=24,n=o.days.length,iw=W-pl-pr,ih=H-pt-pb;
 const X=i=>pl+(n<2?iw/2:i*iw/(n-1)),Y=v=>pt+ih-(v-o.lo)/((o.hi-o.lo)||1)*ih;
 const grid=o.ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" class="gl"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" font-size="11">${o.tf(t)}</text>`).join('');
 const xl=[...new Set([0,Math.floor((n-1)/2),n-1])].map(i=>`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" font-size="11">${short(o.days[i])}</text>`).join('');
 let marks='';
 if(o.bars){const bw=Math.max(1.5,iw/n-2);o.vals.forEach((v,i)=>{if(v==null)return;const y=Y(v);marks+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(pt+ih-y,0).toFixed(1)}" rx="${Math.min(2.5,bw/2)}" style="fill:${o.color}" opacity=".32"/>`})}
 else o.vals.forEach((v,i)=>{if(v!=null)marks+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.8" style="fill:${o.color}" opacity=".55"/>`});
 let path='',pen=false;o.avg.forEach((v,i)=>{if(v==null){pen=false;return}path+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true});
 CH[id]={o,W,pl,iw,n,X,Y};
 return `<div class="chart" data-ch="${id}"><svg viewBox="0 0 ${W} ${H}">${grid}${marks}<path d="${path}" fill="none" style="stroke:${o.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line class="hl" y1="${pt}" y2="${pt+ih}" style="display:none;stroke:var(--mu)"/><circle class="hp" r="5" style="display:none;fill:${o.color};stroke:var(--surf);stroke-width:2.5"/>${xl}<rect x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>`}
function chartAt(e){const el=e.target.closest&&e.target.closest('.chart');if(!el)return;const c=CH[el.dataset.ch];if(!c)return;
 const sv=el.querySelector('svg'),r=sv.getBoundingClientRect(),sx=c.W/r.width,x=(e.clientX-r.left)*sx;
 let i=Math.round((x-c.pl)/(c.n<2?1:c.iw/(c.n-1)));i=Math.max(0,Math.min(c.n-1,i));
 const v=c.o.vals[i],a=c.o.avg[i],hl=el.querySelector('.hl'),hp=el.querySelector('.hp'),tp=el.querySelector('.tip'),X=c.X(i);
 hl.setAttribute('x1',X);hl.setAttribute('x2',X);hl.style.display='';
 const yv=a!=null?a:v;if(yv!=null){hp.setAttribute('cx',X);hp.setAttribute('cy',c.Y(yv));hp.style.display=''}else hp.style.display='none';
 tp.innerHTML=`<b>${long(c.o.days[i])}</b><br>${v==null?'no entry':c.o.vf(v)}${a!=null?` · 7-day avg ${c.o.vf(a)}`:''}`;tp.style.display='block';
 tp.style.left=Math.max(80,Math.min(r.width-80,X/sx))+'px'}
document.addEventListener('pointermove',chartAt);document.addEventListener('pointerdown',chartAt);
document.addEventListener('pointerout',e=>{const el=e.target.closest&&e.target.closest('.chart');if(el&&!el.contains(e.relatedTarget)){el.querySelectorAll('.hl,.hp,.tip').forEach(n=>n.style.display='none')}});
function heatmap(days,fn,color,onTap){
 const t=today(),first=wkStart(days[0]),cols=[];let ws=first;
 while(ws<=days[days.length-1]){cols.push(ws);ws=addD(ws,7)}
 const cs=Math.max(10,Math.min(22,Math.floor((chartW()-4)/cols.length)-3));
 const html=cols.map(w=>`<div class="hcol">${[0,1,2,3,4,5,6].map(k=>{const d=addD(w,k);
  if(d<days[0]||d>t)return `<div class="hc na" style="width:${cs}px;height:${cs}px"></div>`;
  const p=fn(d);const bg=p==null?'var(--heat0)':`color-mix(in srgb,${color} ${Math.round(14+p*86)}%,var(--heat0))`;
  return `<button class="hc${d===sel?' sel':''}" title="${long(d)}${p==null?'':' · '+pc(p)}" style="width:${cs}px;height:${cs}px;background:${p===0?'var(--heatE)':bg}" ${onTap?`onclick="${onTap}('${d}')"`:''}></button>`}).join('')}</div>`).join('');
 return `<div class="heatw"><div class="heat">${html}</div></div><div class="hint" style="display:flex;align-items:center;gap:6px;margin-top:6px">Less <span style="width:12px;height:12px;border-radius:3px;background:var(--heatE)"></span><span style="width:12px;height:12px;border-radius:3px;background:color-mix(in srgb,${color} 50%,var(--heat0))"></span><span style="width:12px;height:12px;border-radius:3px;background:${color}"></span> More${onTap?' · tap a day to open it':''}</div>`}
function bestRun(it,days){let b=0,c=0;days.forEach(d=>{if(isDone(it,val(d,it.id))){c++;b=Math.max(b,c)}else c=0});return b}

function vHistory(){

 if(!start)return {top:`<div style="margin-top:12px">${seg}</div><section class="card" style="--c:var(--cx)"><div class="empty">Nothing logged yet. Once you start ticking practices and filling in check-ins, your charts, streaks and patterns appear here.</div></section>`,secs:[]};
 const days=[];for(let k=n-1;k>=0;k--)days.push(addD(t,-k));
 const tracked=days.filter(d=>d>=start);
 const comp=days.map(d=>d<start?null:dayPct(d)),cAvg=roll(comp).map((v,i)=>comp[i]==null?null:v);
 const weeks=[...new Set(tracked.map(wkStart))].filter(w=>addD(w,6)<t||w===wkStart(t));

 const c1=lineChart({days,vals:comp,avg:cAvg,color:'var(--cx)',bars:true,lo:0,hi:1,ticks:[0,.5,1],tf:pc,vf:pc});
 const hm=heatmap(days,d=>d<start?null:dayPct(d),'var(--cx)','openDay');
 // metrics
 const ms=ST.cfg.metrics;if(!ms.some(m=>m.id===ui.metric))ui.metric=ms.length?ms[0].id:null;
 let mSec='';

  let body;
  if(have.length<2)body=`<div class="empty">Log ${esc(mt.label.toLowerCase())} on a few days to see its trend.</div>`;
  else{let lo,hi,ticks;if(mt.type==='scale'){lo=1;hi=5;ticks=[1,3,5]}else{lo=Math.floor(Math.min(...have));hi=Math.ceil(Math.max(...have));if(hi===lo){hi++;lo--}ticks=[lo,Math.round((lo+hi)/2*10)/10,hi]}
   const u=mt.unit?' '+mt.unit:'',vf=v=>fmN(Math.round(v*10)/10)+u;
   body=lineChart({days,vals,avg:roll(vals),color:'var(--c4)',lo,hi,ticks,tf:v=>fmN(v),vf})+`<div class="hint" style="margin-top:6px">Dots are daily entries; the line is the 7-day average. Average over this period: ${vf(avg(have))} (${have.length} entries).</div>`}
  mSec=`<section class="card" style="--c:var(--c4)"><div class="tag">Check-in trends</div><div class="nm" style="margin-bottom:6px">${esc(mt.label)}</div>${chips}${body}</section>`}
 // practices
 const pRows=groups('daily').map(g=>g.items.map(it=>{const r=tracked.length?tracked.filter(d=>isDone(it,val(d,it.id))).length/tracked.length:0;
  return `<div class="pr" onclick="itemHist('${g.id}','${it.id}')"><div><div style="font-size:13.5px">${esc(it.label)}</div><div class="rb"><i style="width:${r*100}%;background:var(${g.color})"></i></div></div><div class="num">${pc(r)}</div><div class="num mu">${streak(it,t)}d / ${bestRun(it,tracked)}d</div></div>`}).join('')).join('');

 // comparisons

 if(ms.length){if(!ms.some(m=>m.id===ui.cmp))ui.cmp=(ms.find(m=>m.type==='scale')||ms[0]).id;const mt=ms.find(m=>m.id===ui.cmp),lag=ui.lag?1:0;
  const res=[];dailyItems().forEach(it=>{const y=[],no=[];tracked.forEach(d=>{const mv=metric(addD(d,lag),mt.id);if(mv==null)return;(isDone(it,val(d,it.id))?y:no).push(mv)});
   if(y.length>=4&&no.length>=4)res.push({it,a:avg(y),b:avg(no),d:avg(y)-avg(no),ny:y.length,nn:no.length})});
  res.sort((p,q)=>Math.abs(q.d)-Math.abs(p.d));
  const all=tracked.map(d=>metric(addD(d,lag),mt.id)).filter(v=>v!=null),span=mt.type==='scale'?2:Math.max(1e-9,(Math.max(...all,0)-Math.min(...all,0))/2||1);
  const u=mt.unit?' '+mt.unit:'',f=v=>fmN(Math.round(v*10)/10);
  const list=res.length?res.slice(0,10).map(r=>{const w=Math.min(Math.abs(r.d)/span,1)*50;
   return `<div class="cmp"><div class="t1">${esc(r.it.label)}<span>${f(r.a)} vs ${f(r.b)}${u} · ${r.d>=0?'+':'−'}${f(Math.abs(r.d))}</span></div><div class="dv"><i style="${r.d>=0?`left:50%;width:${w}%;background:var(--c0)`:`right:50%;width:${w}%;background:var(--c3)`}"></i></div></div>`}).join('')

  cSec=`<section class="card" style="--c:var(--c0)"><div class="tag">Patterns</div><div class="nm">What seems to help</div><div class="hint" style="margin:4px 0 10px">Average ${esc(mt.label.toLowerCase())} on days you did each practice vs days you didn't. Teal is higher, pink lower. These are associations, not proof.</div><div class="chips">${ms.map(m=>`<button class="${m.id===ui.cmp?'on':''}" onclick="ui.cmp='${m.id}';saveUI();render()">${esc(m.label)}</button>`).join('')}</div><div class="seg" style="margin-bottom:6px"><button class="${!ui.lag?'on':''}" onclick="ui.lag=0;saveUI();render()">Same day</button><button class="${ui.lag?'on':''}" onclick="ui.lag=1;saveUI();render()">Next day</button></div>${list}</section>`}

 const secs=[
  {id:'ov',label:'Overview',c:'--cx',html:()=>H('--cx','Overview','Last '+(n===365?'year':n+' days'),tiles)},
  {id:'comp',label:'Completion',c:'--cx',html:()=>H('--cx','Daily completion','Bars by day · line is the 7-day average',c1)},
  {id:'cal',label:'Calendar',c:'--cx',html:()=>H('--cx','Consistency','Calendar',hm)}];

function vMore(){
 const once=groups('once');
 const look=`<section class="card" style="--c:var(--c1)"><div class="tag">Appearance</div><div class="nm">Theme</div><div class="themes">${THEMES.map(([k,l,d,bg,tx,sw])=>`<button class="th${ui.theme===k?' on':''}" style="--tbg:${bg};--ttx:${tx}" onclick="setTheme('${k}')"><b>${l}</b><small>${d}</small><span class="sws">${sw.map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`).join('')}</div><div class="nm" style="margin:18px 0 10px">Background pattern</div><div class="pats">${PATS.map(([k,l])=>`<button class="pt${(ui.pat||'none')===k?' on':''}" onclick="setPat('${k}')">${k==='none'?'<svg viewBox="0 0 60 44"></svg>':patSVG(k,60,44,true)}${l}</button>`).join('')}</div>
 <div class="nm" style="margin:18px 0 10px">Text size</div><div class="seg"><button class="${ui.size!=='lg'?'on':''}" onclick="setSize('std')">Standard</button><button class="${ui.size==='lg'?'on':''}" onclick="setSize('lg')">Larger</button></div></section>`;
 const set=`<section class="card" style="--c:var(--mu)"><div class="tag">Settings & data</div>
 <button class="set" onclick="openMetrics()"><span>Check-in fields</span><em>${ST.cfg.metrics.length} ›</em></button>
 <button class="set" onclick="downloadBackup()"><span>Download backup file</span><em>${backupAge()===null?'never':backupAge()===0?'today':backupAge()+'d ago'} ›</em></button>
 <button class="set" onclick="$('fileIn').click()"><span>Restore from backup file</span><em>›</em></button>
 <button class="set" onclick="downloadCSV()"><span>Download data as CSV</span><em>›</em></button>
 <button class="set" onclick="openData()"><span>Paste / copy backup text</span><em>›</em></button>
 <div class="hint" style="padding:10px 4px">Your log is stored only on this phone${persisted?', protected from automatic clearing':''}. Download a backup now and then (to Drive or email it to yourself) so you can restore it on a new phone.</div></section>`;
 return {secs:[...once.map(g=>{const p=g.items.length?avg(g.items.map(onceP)):0;return {id:g.id,label:g.name,c:g.color,full:p>=1&&g.items.length>0,html:()=>gCard(g,p,oRow)}}),{id:'look',label:'Appearance',c:'--c1',html:()=>look},{id:'settings',label:'Settings',c:'--mu',html:()=>set}],
  tail:`<button class="addg" onclick="addGroup('once')">＋ New group of one-offs</button>`}}

const TABS=[['today','Today','<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'],
 ['week','Week','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
 ['check','Check-in','<path d="M3 12h4l3-7 4 14 3-7h4"/>'],
 ['history','History','<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
 ['more','More','<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>']];
const VIEWS={today:vToday,week:vWeek,check:vCheck,history:vHistory,more:vMore};
function render(anim){
 if(!VIEWS[ui.view])ui.view='today';
 const dated=['today','week','check'].includes(ui.view);
 $('dnav').style.display=dated?'flex':'none';
 if(ui.view==='week'){const w=wkStart(sel);$('dl').innerHTML=`${short(w)} – ${short(addD(w,6))}<small>${fd(sel,{weekday:'long',day:'numeric'})} selected</small>`}
 else $('dl').innerHTML=`${fd(sel,{weekday:'long',day:'numeric',month:'long'})}${sel===today()?'':'<small>past day</small>'}`;
 $('tb').style.display=sel===today()?'none':'';$('nx').disabled=sel>=today();
 $('tabs').innerHTML=TABS.map(([k,l,ic])=>`<button class="tab${ui.view===k?' on':''}" onclick="setView('${k}')"><span class="pb"><svg viewBox="0 0 24 24">${ic}</svg></span>${l}</button>`).join('');
 for(const k in CH)delete CH[k];
 const V=VIEWS[ui.view]();let cur=SEC[ui.view];if(!cur||(cur!=='all'&&!V.secs.some(x=>x.id===cur)))cur=V.secs.length?V.secs[0].id:'all';
 const st=$('stabs');
 if(V.secs.length>1){st.style.display='';
  const curS=V.secs.find(x=>x.id===cur);st.style.setProperty('--ac',`var(${curS?curS.c:'--cx'})`);
  st.innerHTML=[...V.secs,{id:'all',label:V.allLabel||'All',c:'--cx',all:1}].map(x=>`<button class="st${x.id===cur?' on':''}${x.all?' all':''}" data-s="${x.id}" style="--c:var(${x.c})" onclick="setSec('${x.id}')">${x.all?'':`<i class="${x.full?'full':''}"></i>`}${esc(x.label)}</button>`).join('')}
 else{st.style.display='none';cur='all'}
 single=cur!=='all';
 const body=single?V.secs.find(x=>x.id===cur).html():(V.allTop||'')+V.secs.map(x=>x.html()).join('')+(V.tail||'');
 single=false;
 $('main').innerHTML=`<div class="view ${anim||''}">${V.top||''}${body}</div>`;
 const on=st.querySelector('.st.on');if(on&&st.style.display!=='none'){const tgt=on.offsetLeft-st.clientWidth/2+on.clientWidth/2;st.scrollTo({left:Math.max(0,tgt),behavior:anim==='sec'?'smooth':'auto'})}
 popId=null;
 if(ui.view==='history'){const h=document.querySelector('.heatw');if(h)h.scrollLeft=h.scrollWidth}
}

/* ---------- actions ---------- */
const SEC={};
function setSec(id){if(SEC[ui.view]===id){scrollTo({top:0,behavior:'smooth'});return}SEC[ui.view]=id;render('sec');scrollTo(0,0)}
function setView(v){if(v===ui.view){scrollTo({top:0,behavior:'smooth'});return}ui.view=v;saveUI();render();scrollTo(0,0)}
function go(n){if(ui.view==='week')n*=7;let s=addD(sel,n);if(s>today())s=today();if(s===sel)return;sel=s;render(n>0?'sL':'sR')}
function goToday(){sel=today();render()}
function pick(d){sel=d;render()}
function openDay(d){sel=d;ui.view='today';saveUI();render();scrollTo(0,0)}
function togG(id){ui.collapsed[id]=!ui.collapsed[id];saveUI();render()}
function tap(gid,iid){const it=itemOf(gid,iid);if(it.type==='num')return openNum(gid,iid);const on=!val(sel,iid);setVal(sel,iid,on?1:undefined);if(on){popId=iid;buzz();pastNote()}render()}
function bump(id,n){let v=(+val(sel,id)||0)+n;if(v<0)v=0;setVal(sel,id,v||undefined);if(n>0){buzz();pastNote()}render()}
function tapOnce(gid,iid){const it=itemOf(gid,iid);if(it.type==='count')return openCount(gid,iid);it.done=!it.done;if(it.done)buzz();touchCfg();render()}
function setM(id,v,toggle){const x=day(sel);x.m=x.m||{};if(toggle&&x.m[id]===v)v=undefined;if(v===undefined||isNaN(v))delete x.m[id];else x.m[id]=v;touch('log-'+sel.slice(0,7));if(toggle){buzz();render()}}
function stepM(id,d){const mt=ST.cfg.metrics.find(m=>m.id===id),st=+mt.step||1;let v=metric(sel,id);if(v==null)v=lastMetric(id);if(v==null)v=0;else if(metric(sel,id)!=null)v=v+d*st;v=Math.round(v*1000)/1000;setM(id,v);render()}
function setNote(t){const x=day(sel);if(t.trim())x.n=t;else delete x.n;touch('log-'+sel.slice(0,7))}
let sx0=null;
$('main').addEventListener('touchstart',e=>{const t=e.target;if(!['today','week','check'].includes(ui.view)||t.closest('.chart,.heatw,input,textarea,.seg,.chips,.wstrip,.stabs')){sx0=null;return}sx0=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
$('main').addEventListener('touchend',e=>{if(!sx0)return;const t=e.changedTouches[0],dx=t.clientX-sx0[0],dy=t.clientY-sx0[1];sx0=null;if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy))go(dx<0?1:-1)},{passive:true});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{drawPat();if(ui.view==='history')render()},250)});

/* ---------- sheets ---------- */
function show(h,c){if(!$('sh').classList.contains('on')){try{history.pushState({sheet:1},'')}catch(e){}}const s=$('sh');s.style.setProperty('--c',`var(${c||'--c0'})`);s.innerHTML='<div class="grab"></div>'+h;s.scrollTop=0;s.classList.add('on');$('bd').classList.add('on')}
function closeM(fromPop){const was=$('sh').classList.contains('on');if(was&&!fromPop&&history.state&&history.state.sheet){history.back();return}$('sh').classList.remove('on');$('bd').classList.remove('on');render()}
addEventListener('popstate',()=>{if($('sh').classList.contains('on'))closeM(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sh').classList.contains('on'))closeM()});
function arm(b,fn){if(b.dataset.armed){fn();return}b.dataset.armed=1;const t=b.textContent;b.textContent='Tap again to confirm';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t}},4000)}
const DONE='<div class="btns" style="margin-top:18px"><button class="bb g" style="flex:1" onclick="closeM()">Done</button></div>';

function openNum(gid,iid){const g=grp(gid),it=itemOf(gid,iid),v=+val(sel,iid)||0;
 show(`<div class="tag">${esc(g.name)}</div><h3>${esc(it.label)}</h3><div class="bignum"><button class="sb" onclick="numStep('${iid}',-1)">−</button><input type="number" inputmode="decimal" id="nv" step="any" min="0" value="${v||''}" placeholder="0" onchange="setVal(sel,'${iid}',+this.value)"><button class="sb" onclick="numStep('${iid}',1)">+</button></div><div class="hint" style="text-align:center">Target ${fmN(it.target)} ${esc(it.unit||'')} · ${long(sel)}</div><div class="btns"><button class="bb" style="flex:1" onclick="setVal(sel,'${iid}',${+it.target||1});buzz();closeM()">Hit target</button><button class="bb g" onclick="setVal(sel,'${iid}',undefined);closeM()">Clear</button><button class="bb g" onclick="closeM()">Done</button></div>${it.note?`<p class="hint">${esc(it.note)}</p>`:''}`,g.color)}
function numStep(iid,d){const it=dailyItems().find(i=>i.id===iid),stp=(+it.target>=100)?Math.pow(10,Math.floor(Math.log10(+it.target))-1)*5:(+it.target<=3&&String(it.target).includes('.')?0.25:1);let v=Math.max(0,(+val(sel,iid)||0)+d*stp);v=Math.round(v*100)/100;setVal(sel,iid,v||undefined);$('nv').value=v||''}
function openCount(gid,iid){const g=grp(gid),it=itemOf(gid,iid);
 show(`<div class="tag">${esc(g.name)}</div><h3>${esc(it.label)}</h3><div class="bignum"><button class="sb" onclick="cStep('${gid}','${iid}',-1)">−</button><input type="number" id="cv" min="0" value="${+it.cur||0}" onchange="itemOf('${gid}','${iid}').cur=+this.value||0;touchCfg()"><button class="sb" onclick="cStep('${gid}','${iid}',1)">+</button></div><div class="hint" style="text-align:center">Target ${fmN(it.target)}</div>${DONE}`,g.color)}
function cStep(gid,iid,d){const it=itemOf(gid,iid);it.cur=Math.max(0,(+it.cur||0)+d);touchCfg();$('cv').value=it.cur;if(d>0)buzz()}

function itemHist(gid,iid){const g=grp(gid),it=itemOf(gid,iid),t=today(),start=firstDay(),days=[];for(let k=ui.range-1;k>=0;k--)days.push(addD(t,-k));
 const tracked=days.filter(d=>start&&d>=start),dn=tracked.filter(d=>isDone(it,val(d,it.id))).length;
 const nums=it.type==='num'?tracked.map(d=>+val(d,it.id)||0):null;
 show(`<div class="tag">${esc(g.name)}</div><h3>${esc(it.label)}</h3><div class="tiles"><div class="tile"><b>${tracked.length?pc(dn/tracked.length):'–'}</b><span>done, last ${ui.range===365?'year':ui.range+' days'}</span></div><div class="tile"><b>${streak(it,t)}</b><span>current streak</span></div><div class="tile"><b>${bestRun(it,tracked)}</b><span>best streak</span></div></div>${nums?`<p class="hint">Average ${fmN(Math.round(avg(nums)*10)/10)} ${esc(it.unit||'')} a day.</p>`:''}<h4>Calendar</h4>${heatmap(days,d=>d<(start||t)?null:(isDone(it,val(d,it.id))?1:0),`var(${g.color})`,null)}<div class="btns" style="margin-top:18px"><button class="bb g" onclick="editItem('${gid}','${iid}')">Edit practice</button><button class="bb g" style="flex:1" onclick="closeM()">Done</button></div>`,g.color);
 const h=$('sh').querySelector('.heatw');if(h)h.scrollLeft=h.scrollWidth}

function editItem(gid,iid){
 const g=grp(gid),it=itemOf(gid,iid),k=g.kind;let typ='';
 if(k==='daily')typ=`<div class="fr"><label>Type</label><select onchange="chType('${gid}','${iid}',this.value)"><option value="check"${it.type==='check'?' selected':''}>Tick when done</option><option value="num"${it.type==='num'?' selected':''}>Amount with a target</option></select></div>${it.type==='num'?`<div class="fr"><label>Daily target</label><input type="number" step="any" min="0" value="${it.target}" onchange="setI('${gid}','${iid}','target',+this.value||1)"><input type="text" style="width:90px" placeholder="unit" value="${esc(it.unit||'')}" onchange="setI('${gid}','${iid}','unit',this.value)"></div>`:''}`;
 if(k==='weekly')typ=`<div class="fr"><label>Sessions per week</label><input type="number" min="1" value="${it.target}" onchange="setI('${gid}','${iid}','target',+this.value||1)"></div>`;
 if(k==='once')typ=`<div class="fr"><label>Type</label><select onchange="chType('${gid}','${iid}',this.value)"><option value="check"${it.type==='check'?' selected':''}>Tick when done</option><option value="count"${it.type==='count'?' selected':''}>Count toward a target</option></select></div>${it.type==='count'?`<div class="fr"><label>Target</label><input type="number" min="1" value="${it.target}" onchange="setI('${gid}','${iid}','target',+this.value||1)"></div>`:''}`;
 const others=groups(k).filter(x=>x.id!==gid);
 show(`<div class="tag">${esc(g.name)}</div><h3>Edit practice</h3><input type="text" value="${esc(it.label)}" onchange="setI('${gid}','${iid}','label',this.value)">${typ}
 <h4>Note</h4><textarea placeholder="Why, how, dose, teacher, link…" onchange="setI('${gid}','${iid}','note',this.value)">${esc(it.note||'')}</textarea>
 <h4>Arrange</h4><div class="btns"><button class="bb g" onclick="mv('${gid}','${iid}',-1)">Move up</button><button class="bb g" onclick="mv('${gid}','${iid}',1)">Move down</button>${others.length?`<select onchange="if(this.value)moveTo('${gid}','${iid}',this.value)"><option value="">Move to group…</option>${others.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select>`:''}</div>
 <div class="btns"><button class="bb dg" onclick="arm(this,()=>delItem('${gid}','${iid}'))">Delete practice</button></div><p class="hint">Deleting a practice hides it; its past log stays in your data.</p>${DONE}`,g.color)}
function setI(gid,iid,f,v){itemOf(gid,iid)[f]=v;touchCfg()}
function chType(gid,iid,t){const it=itemOf(gid,iid);it.type=t;if(t==='num'){it.target=it.target||1;it.unit=it.unit||''}if(t==='count'){it.target=it.target||1;it.cur=it.cur||0}touchCfg();editItem(gid,iid)}
function mv(gid,iid,d){const g=grp(gid),i=g.items.findIndex(x=>x.id===iid),j=i+d;if(j<0||j>=g.items.length)return;[g.items[i],g.items[j]]=[g.items[j],g.items[i]];touchCfg();toast(d<0?'Moved up':'Moved down')}
function moveTo(gid,iid,to){const g=grp(gid),it=itemOf(gid,iid);g.items=g.items.filter(x=>x.id!==iid);grp(to).items.push(it);touchCfg();closeM()}
function delItem(gid,iid){const g=grp(gid);g.items=g.items.filter(x=>x.id!==iid);touchCfg();closeM()}

function openGroup(gid){
 const g=grp(gid),k=g.kind;
 const tgt=k==='daily'?`<select id="nty"><option value="check">Tick when done</option><option value="num">Amount with a target</option></select><input type="number" id="nt" step="any" placeholder="target" style="width:100px"><input type="text" id="nu" style="width:80px" placeholder="unit">`
  :k==='weekly'?`<input type="number" id="nt" min="1" placeholder="per week" value="1" style="width:110px">`
  :`<input type="number" id="nt" min="1" placeholder="count target (optional)" style="flex:1">`;
 show(`<div class="tag">${esc(g.name)}</div><h3>${esc(g.sub)}</h3>
 <h4>Add practice</h4><input type="text" id="nl" placeholder="${k==='daily'?'e.g. Cold shower finish':k==='weekly'?'e.g. Swim':'e.g. Optician appointment'}" onkeydown="if(event.key==='Enter')addI('${gid}')"><div class="btns">${tgt}<button class="bb" onclick="addI('${gid}')">Add</button></div>
 <h4>Group name</h4><input type="text" value="${esc(g.name)}" onchange="grp('${gid}').name=this.value;touchCfg()"><div style="height:8px"></div><input type="text" value="${esc(g.sub)}" onchange="grp('${gid}').sub=this.value;touchCfg()">
 <h4>Colour</h4><div class="sw">${COLORS.map(c=>`<button class="${g.color===c?'on':''}" style="background:var(${c})" aria-label="Colour" onclick="grp('${gid}').color='${c}';touchCfg();openGroup('${gid}')"></button>`).join('')}</div>
 <h4>Arrange</h4><div class="btns"><button class="bb g" onclick="mvG('${gid}',-1)">Move group up</button><button class="bb g" onclick="mvG('${gid}',1)">Move group down</button><button class="bb dg" onclick="arm(this,()=>delGroup('${gid}'))">Delete group</button></div>${DONE}`,g.color)}
function addI(gid){const g=grp(gid),l=$('nl').value.trim();if(!l)return;const t=+($('nt')||{}).value||0;let it;
 if(g.kind==='daily')it=($('nty').value==='num')?N(nid(),l,t||1,$('nu').value.trim()):C(nid(),l);
 else if(g.kind==='weekly')it=S(nid(),l,t||1);
 else it=t>0?C(nid(),l,{type:'count',cur:0,target:t}):C(nid(),l,{done:false});
 g.items.push(it);touchCfg();toast('Added: '+l);$('nl').value='';$('nl').focus()}
function mvG(gid,d){const a=ST.cfg.groups,g=grp(gid),same=a.filter(x=>x.kind===g.kind),i=same.indexOf(g),o=same[i+d];if(!o)return;const ia=a.indexOf(g),ib=a.indexOf(o);[a[ia],a[ib]]=[a[ib],a[ia]];touchCfg();toast(d<0?'Moved up':'Moved down')}
function delGroup(gid){ST.cfg.groups=ST.cfg.groups.filter(g=>g.id!==gid);touchCfg();closeM()}
function addGroup(kind){const g={id:'g'+nid(),kind,color:COLORS[ST.cfg.groups.filter(x=>x.kind===kind).length%7],name:'New group',sub:kind==='weekly'?'Sessions this week':kind==='daily'?'Daily practices':'One-off steps',items:[]};ST.cfg.groups.push(g);touchCfg();openGroup(g.id)}

function openMetrics(){
 const rows=ST.cfg.metrics.map((m,ix)=>`<div class="fr"><input type="text" style="flex:1;width:auto;min-width:120px" value="${esc(m.label)}" onchange="ST.cfg.metrics[${ix}].label=this.value;touchCfg()"><select onchange="ST.cfg.metrics[${ix}].type=this.value;touchCfg();openMetrics()"><option value="scale"${m.type==='scale'?' selected':''}>1–5 scale</option><option value="num"${m.type==='num'?' selected':''}>Number</option></select>${m.type==='num'?`<input type="text" style="width:70px" placeholder="unit" value="${esc(m.unit||'')}" onchange="ST.cfg.metrics[${ix}].unit=this.value;touchCfg()">`:''}<button class="bb g" aria-label="Move up" onclick="mvM(${ix},-1)">↑</button><button class="bb dg" aria-label="Delete" onclick="arm(this,()=>{ST.cfg.metrics.splice(${ix},1);touchCfg();openMetrics()})">✕</button></div>`).join('');
 show(`<div class="tag">Check-in</div><h3>Check-in fields</h3>${rows}<h4>Add field</h4><input type="text" id="ml" placeholder="e.g. HRV, Skin, Libido"><div class="btns"><select id="mt"><option value="scale">1–5 scale</option><option value="num">Number</option></select><input type="text" id="mu" placeholder="unit" style="width:90px"><button class="bb" onclick="addM()">Add</button></div>${DONE}`,'--c4')}
function mvM(ix,d){const a=ST.cfg.metrics,j=ix+d;if(j<0||j>=a.length)return;[a[ix],a[j]]=[a[j],a[ix]];touchCfg();openMetrics()}
function addM(){const l=$('ml').value.trim();if(!l)return;ST.cfg.metrics.push({id:'m'+nid(),label:l,type:$('mt').value,unit:$('mu').value.trim(),step:'any'});touchCfg();openMetrics()}

function csv(){
 const d=dailyItems(),w=groups('weekly').flatMap(g=>g.items),m=ST.cfg.metrics,q=s=>{s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const head=['date',...d.map(i=>i.label),...w.map(i=>i.label+' (sessions)'),...m.map(x=>x.label+(x.unit?' ('+x.unit+')':'')),'daily completion %','notes'];
 const all=[];for(const k in ST.months)for(const ds in ((ST.months[k]||{}).days||{}))all.push(ds);all.sort();
 const rows=all.map(ds=>{const x=peek(ds)||{},i=x.i||{},mm=x.m||{};return [ds,...d.map(it=>it.type==='num'?(i[it.id]||''):(isDone(it,i[it.id])?1:'')),...w.map(it=>i[it.id]||''),...m.map(z=>mm[z.id]==null?'':mm[z.id]),Math.round(dayPct(ds)*100),x.n||''].map(q).join(',')});
 return [head.map(q).join(','),...rows].join('\n')}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function downloadBackup(){dl('sel-backup-'+today()+'.json',JSON.stringify({app:'sel',v:1,exported:new Date().toISOString(),cfg:ST.cfg,months:ST.months}),'application/json');try{localStorage.setItem('pv-lastbackup',today())}catch(e){}toast('Backup saved to Downloads');render()}
function downloadCSV(){dl('sel-data-'+today()+'.csv',csv(),'text/csv');toast('CSV saved to Downloads')}
function restoreObj(n,how){if(!n||!n.cfg||!n.cfg.groups)throw 0;
 const merge=how==='merge';if(merge){for(const k in (n.months||{})){ST.months[k]=ST.months[k]||{days:{}};const src=n.months[k].days||{};for(const d in src){if(!ST.months[k].days[d])ST.months[k].days[d]=src[d]}}}
 else{ST.cfg=n.cfg;ST.months=n.months||{}}
 migrate(ST.cfg);saveLocal()}
function readBackup(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>{let n;try{n=JSON.parse(r.result);if(!n.cfg)throw 0}catch(e){toast('That file is not a Sel. backup');return}
 const cnt=Object.values(n.months||{}).reduce((a,m)=>a+Object.keys(m.days||{}).length,0);
 show(`<h3>Restore backup</h3><p class="hint">${esc(f.name)} · ${cnt} logged days.</p><div class="btns" style="flex-direction:column"><button class="bb" onclick="doRestore('replace')">Replace everything on this phone</button><button class="bb g" onclick="doRestore('merge')">Add missing days only (keep current practices)</button><button class="bb g" onclick="closeM()">Cancel</button></div>`,'--cx');window._pending=n};r.readAsText(f)}
function doRestore(how){try{restoreObj(window._pending,how);window._pending=null;toast('Restored');closeM()}catch(e){toast('Could not restore that backup')}}
function openCSV(){show(`<h3>Data as CSV</h3><div class="hint">One row per day, ready to paste into a spreadsheet.</div><textarea id="dt" style="min-height:200px;margin:10px 0;font-size:12px" readonly>${esc(csv())}</textarea><div class="btns"><button class="bb" onclick="copyD(this)">Copy</button><button class="bb g" style="flex:1" onclick="closeM()">Done</button></div>`,'--cx')}
function openData(){
 show(`<h3>Backup text</h3><div class="hint">Copy this text to keep it, or paste text exported from the earlier web version and tap Restore. Restore replaces everything on this phone.</div><textarea id="dt" style="min-height:200px;margin:10px 0;font-size:12px">${esc(JSON.stringify({cfg:ST.cfg,months:ST.months}))}</textarea>
 <div class="btns"><button class="bb" onclick="copyD(this)">Copy</button><button class="bb g" onclick="importD()">Restore</button><button class="bb dg" onclick="arm(this,resetCfg)">Reset practices</button></div><p class="hint">Reset restores the default list of practices; your logged history is kept.</p>${DONE}`,'--cx')}
async function copyD(b){const t=$('dt');try{await navigator.clipboard.writeText(t.value);b.textContent='Copied'}catch(e){t.select();try{document.execCommand('copy');b.textContent='Copied'}catch(_){b.textContent='Select & copy manually'}}}
function importD(){try{restoreObj(JSON.parse($('dt').value),'replace');toast('Restored');closeM()}catch(e){$('dt').style.borderColor='var(--c3)';toast('That text is not valid backup data')}}
function resetCfg(){ST.cfg=clone(DEF);touchCfg();toast('Practices reset');closeM()}

{const v=new URLSearchParams(location.search).get('view');if(v&&VIEWS[v]){ui.view=v;history.replaceState(null,'',location.pathname)}}
render();
askPersist();
let newSW=null;
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
 const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){newSW=w;$('upd').classList.add('on')}})};
 if(reg.waiting&&navigator.serviceWorker.controller){newSW=reg.waiting;$('upd').classList.add('on')}
 reg.addEventListener('updatefound',()=>watch(reg.installing));
 setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
}).catch(()=>{})});
 let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload()}})}
function applyUpdate(){if(newSW)newSW.postMessage('skipWaiting');else location.reload()}
let lastSeen=today();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const t=today();if(t!==lastSeen){if(sel===lastSeen)sel=t;lastSeen=t;render()}});
</script>
