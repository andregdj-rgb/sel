<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<meta name="description" content="Daily and weekly tracker for Sel.Phys and Sel.Meta practices.">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Manrope:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080a11;--card2:#1a1f31;--line:#262c42;--tx:#e8eaf3;--mu:#8b92ad;
--c0:#3dd6c6;--c1:#9b8cff;--c2:#ffb454;--c3:#ff6f91;--c4:#6fb7ff;--c5:#8fe388;--c6:#ff9b6b;--cx:#f5d26b;
--serif:'Cormorant Garamond','Iowan Old Style',Palatino,Georgia,serif;--sans:'Manrope',Inter,system-ui,-apple-system,sans-serif;--nav:66px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#080a11}
body{color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.45;letter-spacing:.01em;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none;
background:radial-gradient(700px 420px at 90% -5%,#241d4a55 0,transparent 60%),radial-gradient(600px 420px at 0% 105%,#0f3a4455 0,transparent 60%),#080a11;background-attachment:fixed}
button{font:inherit;font-family:var(--sans);cursor:pointer}
.top{position:sticky;top:0;z-index:4;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;background:linear-gradient(#080a11 72%,#080a11d9 88%,transparent);backdrop-filter:blur(10px)}
.tin{max-width:600px;margin:0 auto}
.r1{display:flex;align-items:center;gap:10px}
.brand{font:500 25px/1 var(--serif);background:linear-gradient(90deg,#f6efe0,#f5d26b 70%);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
.sync{width:9px;height:9px;border-radius:50%;background:var(--mu)}.sync.ok{background:var(--c5);box-shadow:0 0 8px var(--c5)}.sync.warn{background:var(--c2)}
.dnav{display:flex;align-items:center;gap:8px;margin-top:8px}
.dt{flex:1;text-align:center;font:500 21px/1.1 var(--serif)}
.dt small{display:block;font:300 11px var(--sans);letter-spacing:.12em;color:var(--mu);text-transform:uppercase;margin-top:2px}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid #ffffff14;background:#ffffff06;color:var(--tx);display:inline-flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.ib:disabled{opacity:.25}
.tdy{font-size:11px;letter-spacing:.08em;padding:0 10px;width:auto}
main{max-width:600px;margin:0 auto;padding:4px 14px calc(var(--nav) + env(safe-area-inset-bottom,0px) + 28px);touch-action:pan-y}
.view{animation:vin .22s ease-out}@keyframes vin{from{opacity:0;transform:translateY(6px)}}
.sL{animation:sL .22s ease-out}@keyframes sL{from{opacity:.2;transform:translateX(28px)}}
.sR{animation:sR .22s ease-out}@keyframes sR{from{opacity:.2;transform:translateX(-28px)}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0d1020f0;backdrop-filter:blur(16px);border-top:1px solid #ffffff10;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabsin{max-width:600px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--mu);font-size:11px;letter-spacing:.03em;background:none;border:0}
.tab .pb{padding:4px 18px;border-radius:16px;display:flex;transition:background .2s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--cx)}.tab.on .pb{background:#f5d26b1f}
.card{--c:var(--c0);background:linear-gradient(155deg,#1b2036cc,#111522cc);border:1px solid #ffffff12;border-top:1px solid color-mix(in srgb,var(--c) 70%,transparent);border-radius:22px;padding:16px 14px;margin:12px 0;box-shadow:0 18px 40px -26px #000,inset 0 1px 0 #ffffff0a}
.hero{display:flex;align-items:center;gap:18px}
.big{font:500 34px/1.05 var(--serif)}
.tag{font:600 10px var(--sans);letter-spacing:.24em;color:var(--c);text-transform:uppercase}
.hint{color:var(--mu);font-size:12.5px;font-weight:300;letter-spacing:.03em}
.ch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:0 2px}
.nm{font:500 22px/1.15 var(--serif);margin-top:2px}
.ch .p{color:var(--c);font:500 22px var(--serif)}
.chev{color:var(--mu);font-size:18px;transition:transform .2s;transform:rotate(-90deg);width:22px;text-align:center}.chev.open{transform:none}
.bar{height:3px;background:#0d1020;border-radius:5px;overflow:hidden;margin:10px 2px 8px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s;box-shadow:0 0 10px var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,transparent),var(--c))}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 4px 8px 12px;margin:6px 0;border-radius:16px;background:#0b0e1a99;border:1px solid #ffffff0d;position:relative;overflow:hidden;cursor:pointer;user-select:none;transition:transform .12s,border-color .15s;width:100%;color:var(--tx);text-align:left}
.row:active{transform:scale(.985);border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);flex:none;display:flex;align-items:center;justify-content:center;transition:background .15s}
.row.d .ck{background:var(--c);box-shadow:0 0 12px -2px var(--c)}
.row.d .ck::after{content:'';width:6px;height:11px;border:solid #0b0d14;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.row.pop .ck{animation:pop .32s ease-out}@keyframes pop{40%{transform:scale(1.3)}}
.row.d .lb{opacity:.6}
.lbw{flex:1;min-width:0}
.lb{font-size:15px;line-height:1.3}
.meta{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:11.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.mini{display:flex;gap:3px}
.mini i{width:6px;height:6px;border-radius:50%;background:#ffffff16;display:block}
.mini i.on{background:var(--c)}
.mini i.now{outline:1px solid #ffffff60;outline-offset:1px}
.mo{width:42px;height:42px;border-radius:12px;color:var(--mu);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:none;border:0}
.f{position:absolute;left:0;bottom:0;height:2px;background:var(--c)}
.add{justify-content:center;border-style:dashed;color:var(--mu);min-height:46px;font-weight:300;letter-spacing:.06em}
.addg{display:flex;width:100%;align-items:center;justify-content:center;min-height:56px;margin:12px 0;border:1px dashed #ffffff1c;border-radius:22px;color:var(--mu);background:none;letter-spacing:.08em;font-weight:300}
.stp{display:flex;align-items:center;gap:6px;flex:none}
.sb{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff1c;background:#ffffff08;color:var(--tx);font-size:21px;display:flex;align-items:center;justify-content:center}
.sb:active{background:color-mix(in srgb,var(--c) 30%,transparent)}
.sn{min-width:20px;text-align:center;color:var(--c);font-weight:600}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border-radius:14px;padding:7px 0 6px;text-align:center;background:#0b0e1a99;border:1px solid #ffffff0d;color:var(--tx)}
.wd.sel{border-color:var(--cx);background:#f5d26b14}
.wd:disabled{opacity:.3}
.wd small{display:block;font-size:10px;letter-spacing:.1em;color:var(--mu)}
.wd svg{width:30px;height:30px;display:block;margin:4px auto 0}
.mc{padding:12px 4px;border-bottom:1px solid #ffffff08}.mc:last-of-type{border-bottom:0}
.mh{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.mh b{font-weight:500;font-size:15px}.mh span{color:var(--mu);font-size:11.5px;margin-left:auto;font-variant-numeric:tabular-nums}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{height:46px;border-radius:13px;border:1px solid #ffffff1a;background:#ffffff06;color:var(--mu);font-size:16px;font-weight:500}
.scale button.on{background:var(--c);color:#0b0d14;border-color:var(--c);box-shadow:0 0 14px -3px var(--c)}
.numin{display:flex;align-items:center;gap:8px}
.numin input{flex:1;text-align:center;font-size:18px}
input[type=number],input[type=text],textarea,select{background:#0d1020;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-family:var(--sans);font-size:16px;width:100%}
select{width:auto}
textarea{min-height:110px;resize:vertical}
.seg{display:flex;background:#0b0e1a;border-radius:13px;padding:3px;border:1px solid #ffffff10;gap:2px}
.seg button{flex:1;background:none;border:0;color:var(--mu);padding:9px 6px;border-radius:10px;font-size:12.5px;white-space:nowrap}
.seg button.on{background:#ffffff14;color:var(--tx)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid #ffffff18;background:none;color:var(--mu);border-radius:20px;padding:7px 13px;font-size:12.5px}
.chips button.on{border-color:var(--c4);color:var(--tx);background:#6fb7ff1a}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#0b0e1a99;border:1px solid #ffffff0d;border-radius:16px;padding:12px 10px}
.tile b{display:block;font:500 28px/1 var(--serif)}
.tile span{display:block;font-size:11px;color:var(--mu);margin-top:6px;line-height:1.3}
.chart{position:relative;padding-top:40px;margin:4px 0 2px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;top:0;transform:translateX(-50%);pointer-events:none;background:#0d1020;border:1px solid #ffffff22;border-radius:10px;padding:5px 9px;font-size:12px;white-space:nowrap;display:none;font-variant-numeric:tabular-nums;line-height:1.35}
.heatw{overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.heat{display:flex;gap:3px}
.hcol{display:flex;flex-direction:column;gap:3px}
.hc{border-radius:4px;background:#141a2c;cursor:pointer;border:1px solid transparent;padding:0}
.hc.na{background:transparent;cursor:default}
.hc.sel{border-color:#fff}
.pr{display:grid;grid-template-columns:1fr 50px 74px;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid #ffffff08;cursor:pointer}
.pr.h{cursor:default;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);padding-top:2px}
.pr .num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.pr .mu{color:var(--mu)}
.rb{height:3px;background:#ffffff0c;border-radius:3px;margin-top:6px;overflow:hidden}.rb i{display:block;height:100%;border-radius:3px}
.cmp{padding:10px 4px;border-bottom:1px solid #ffffff08}
.cmp .t1{display:flex;gap:8px;font-size:13.5px}.cmp .t1 span{margin-left:auto;color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.dv{position:relative;height:8px;margin-top:7px;background:#ffffff08;border-radius:4px}
.dv::before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#8b92ad80}
.dv i{position:absolute;top:0;bottom:0;border-radius:4px}
.empty{text-align:center;padding:26px 10px;color:var(--mu);font-weight:300}
.set{display:flex;align-items:center;gap:12px;min-height:54px;width:100%;padding:8px 12px;margin:6px 0;border-radius:14px;background:#0b0e1a99;border:1px solid #ffffff0d;color:var(--tx);text-align:left}
.set span{flex:1}.set em{font-style:normal;color:var(--mu)}
#bd{position:fixed;inset:0;background:#05060bb8;opacity:0;pointer-events:none;transition:opacity .22s;z-index:8}
#bd.on{opacity:1;pointer-events:auto}
#sh{--c:var(--c0);position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:90vh;overflow:auto;background:linear-gradient(160deg,#1a1f36,#10131f);border-top:1px solid var(--c);border-radius:26px 26px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto;box-shadow:0 -20px 60px -20px var(--c)}
#sh.on{transform:none}
.grab{width:42px;height:4px;border-radius:2px;background:#ffffff30;margin:0 auto 12px}
#sh h3{margin:4px 0 12px;font:500 28px/1.1 var(--serif)}
#sh h4{font:500 10.5px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--mu);margin:20px 0 8px}
.fr{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:8px 0;background:var(--card2);border-radius:13px;border:1px solid var(--line);flex-wrap:wrap}
.fr label{flex:1;min-width:110px}
.fr input[type=number]{width:110px}
.bb{background:var(--c);color:#0b0d14;border:0;border-radius:12px;padding:11px 16px;font-weight:600;letter-spacing:.03em}
.bb.g{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:500}
.bb.dg{background:transparent;color:var(--c3);border:1px solid color-mix(in srgb,var(--c3) 45%,transparent)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bignum{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}
.bignum input{width:130px;text-align:center;font:500 30px var(--serif)}
.bignum .sb{width:54px;height:54px;font-size:26px}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:32px;height:32px;border-radius:50%;border:2px solid transparent}.sw button.on{border-color:#fff}
.banner{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:10px 12px;border-radius:16px;background:#ffb4541a;border:1px solid #ffb45455;font-size:13px}
.banner span{flex:1}.banner .bb{padding:8px 12px;font-size:12.5px}
#upd{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:10;display:none;background:#1d2338;border:1px solid var(--cx);border-radius:14px;padding:10px 14px;font-size:13px;gap:10px;align-items:center}
#upd.on{display:flex}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,20px);opacity:0;transition:.25s;background:#1d2338;border:1px solid #ffffff20;border-radius:14px;padding:10px 16px;font-size:13px;z-index:7;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<header class="top"><div class="tin">
 <div class="r1"><div class="brand">Sel.Phys/Sel.Meta</div></div>
 <div class="dnav" id="dnav"><button class="ib" onclick="go(-1)" aria-label="Previous">‹</button><div class="dt" id="dl"></div><button class="ib tdy" id="tb" onclick="goToday()">Today</button><button class="ib" id="nx" onclick="go(1)" aria-label="Next">›</button></div>
</div></header>
<main id="main"></main>
<nav class="tabs"><div class="tabsin" id="tabs"></div></nav>
<div id="toast"></div><div id="upd"><span>A new version is ready</span><button class="bb" style="--c:var(--cx);padding:7px 12px" onclick="applyUpdate()">Update</button></div><input type="file" id="fileIn" accept="application/json,.json,text/plain" style="display:none" onchange="readBackup(this)">
<div id="bd" onclick="closeM()"></div><div id="sh"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
let _n=0;const nid=()=>'x'+Date.now().toString(36)+(_n++).toString(36);
const fmN=n=>Number(n||0).toLocaleString('en-GB',{maximumFractionDigits:2});
const pc=n=>Math.round(n*100)+'%';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const COLORS=['--c0','--c1','--c2','--c3','--c4','--c5','--c6','--cx'];
const C=(id,label,o={})=>Object.assign({id,label,type:'check',note:''},o);
const N=(id,label,target,unit,o={})=>C(id,label,Object.assign({type:'num',target,unit},o));
const S=(id,label,target,o={})=>C(id,label,Object.assign({type:'count',target},o));
const PHYS=()=>({id:'g_phys',kind:'daily',color:'--cx',name:'Sel.Phys',sub:'Exercise, heat, cold & yoga',items:[
  C('exer','Exercise'),C('sauna','Sauna'),C('cold','Cold exposure',{note:'Keep it a few hours away from strength sessions; cold straight after lifting can blunt muscle gains.'}),C('yoga','Yoga')]});
const META=(med)=>({id:'g_meta',kind:'daily',color:'--c1',name:'Sel.Meta',sub:'Meditation & prayer',items:[
  med||N('med','Meditation',10,'min'),C('prayer','Prayer')]});
const DEF={v:2,groups:[
 PHYS(),META(),
 {id:'g_found',kind:'daily',color:'--c0',name:'Foundations',sub:'Sleep, light & the basics',items:[
  C('sleep','7–9 h sleep, consistent times'),C('light','Outdoor light within an hour of waking'),C('caf','No caffeine after 2 pm'),C('alc','Alcohol-free'),
  N('steps','Steps',8000,'steps'),N('water','Water',2,'L')]},
 {id:'g_body',kind:'daily',color:'--c4',name:'Body & carriage',sub:'Release, mobility, posture',items:[
  C('mob','Mobility routine (hips, upper back, shoulders)'),C('semi','Alexander semi-supine, 10 min'),N('scan','Tension scans: jaw, brow, shoulders, breath',3,'×')]},
 {id:'g_voice',kind:'daily',color:'--c2',name:'Voice',sub:'Breath, resonance, expression',items:[
  C('breath','Low diaphragmatic breathing practice'),C('sovt','Humming / lip trills / straw phonation, 5 min'),C('read','Read aloud, 5–10 min')]},
 {id:'g_face',kind:'daily',color:'--c3',name:'Face, eyes & skin',sub:'Daily care',items:[
  C('spf','Sunscreen SPF 30+'),C('ret','Retinoid (evening)'),C('floss','Floss'),C('eyes','20-20-20 screen breaks')]},
 {id:'g_mind',kind:'daily',color:'--c4',name:'Mind & presence',sub:'Attention & nervous system',items:[
  C('hrv','Resonance breathing, ~6/min, 5 min'),C('jour','Journal / reflection')]},
 {id:'g_diet',kind:'daily',color:'--c5',name:'Diet',sub:'Mediterranean pattern',items:[
  C('prot','Protein at every meal'),N('veg','Veg & fruit portions',5,''),C('upf','Minimal ultra-processed food'),C('ferm','Fermented food')]},
 {id:'g_supp',kind:'daily',color:'--c6',name:'Supplements',sub:'Adjust once bloods are back',items:[
  C('vitd','Vitamin D 10 µg',{note:'NHS advises this for everyone in the UK from October to March.'}),C('crea','Creatine 3–5 g'),C('omega','Omega-3 (if no oily fish today)'),C('mag','Magnesium glycinate (evening)')]},
 {id:'w_train',kind:'weekly',color:'--c0',name:'Training',sub:'Sessions this week',items:[S('str','Strength training',3),S('z2','Zone 2 cardio',3),S('hiit','Intervals',1)]},
 {id:'w_move',kind:'weekly',color:'--c1',name:'Movement practices',sub:'Awareness & control',items:[S('pil','Pilates',1),S('feld','Feldenkrais',1),S('tai','Tai chi / qigong',1),S('dance','Dance',1)]},
 {id:'w_rest',kind:'weekly',color:'--c2',name:'Recovery & lessons',sub:'Teachers & coaching',items:[S('alex','Alexander Technique lesson',1),S('sing','Singing / voice lesson',1)]},
 {id:'w_life',kind:'weekly',color:'--c3',name:'Food & mind',sub:'Weekly rhythm',items:[S('fish','Oily fish meals',3),S('learn','Piano / language / hard-skill practice',4),S('social','Quality social time',2)]},
 {id:'o_setup',kind:'once',color:'--cx',name:'Courses & one-offs',sub:'Set up once, then maintain',items:[
  C('blood','Blood panel: ferritin, B12, folate, thyroid, vit D, HbA1c',{done:false}),C('adj','Supplements adjusted to blood results',{done:false}),
  C('alexb','Alexander Technique lessons (block)',{type:'count',cur:0,target:10}),C('singb','Singing lessons (term)',{type:'count',cur:0,target:10}),
  C('dent','Dental check-up & hygienist',{done:false}),C('book','Read Linklater, Freeing the Natural Voice',{done:false}),
  C('feldsrc','Feldenkrais ATM recordings sourced',{done:false}),C('track','Sleep / HRV tracking set up (optional)',{done:false})]}
],
metrics:[
 {id:'m_sleep',label:'Sleep',type:'num',unit:'h',step:0.25},{id:'m_energy',label:'Energy',type:'scale'},{id:'m_focus',label:'Focus',type:'scale'},
 {id:'m_mood',label:'Mood',type:'scale'},{id:'m_calm',label:'Calm',type:'scale'},{id:'m_rhr',label:'Resting HR',type:'num',unit:'bpm',step:1},{id:'m_wt',label:'Weight',type:'num',unit:'kg',step:0.1}
]};

/* ---------- state & storage ---------- */
const LSK='pv-console-v1';
let ST={cfg:clone(DEF),months:{}};
function migrate(cfg){
 let ch=false;if(!cfg.metrics){cfg.metrics=clone(DEF.metrics);ch=true}
 if(!(cfg.v>=2)){
  let med=null;
  cfg.groups.forEach(g=>{g.items=g.items.filter(it=>{
   if(it.id==='med'&&g.kind==='daily'){med=it;return false}
   if((it.id==='sauna'||it.id==='yoga')&&g.kind==='weekly')return false;
   return true})});

function addGroup(kind){const g={id:'g'+nid(),kind,color:COLORS[ST.cfg.groups.filter(x=>x.kind===kind).length%7],name:'New group',sub:kind==='weekly'?'Sessions this week':kind==='daily'?'Daily practices':'One-off steps',items:[]};ST.cfg.groups.push(g);touchCfg();openGroup(g.id)}

function openMetrics(){
 const rows=ST.cfg.metrics.map((m,ix)=>`<div class="fr"><input type="text" style="flex:1;width:auto;min-width:120px" value="${esc(m.label)}" onchange="ST.cfg.metrics[${ix}].label=this.value;touchCfg()"><select onchange="ST.cfg.metrics[${ix}].type=this.value;touchCfg();openMetrics()"><option value="scale"${m.type==='scale'?' selected':''}>1–5 scale</option><option value="num"${m.type==='num'?' selected':''}>Number</option></select>${m.type==='num'?`<input type="text" style="width:70px" placeholder="unit" value="${esc(m.unit||'')}" onchange="ST.cfg.metrics[${ix}].unit=this.value;touchCfg()">`:''}<button class="bb g" aria-label="Move up" onclick="mvM(${ix},-1)">↑</button><button class="bb dg" aria-label="Delete" onclick="arm(this,()=>{ST.cfg.metrics.splice(${ix},1);touchCfg();openMetrics()})">✕</button></div>`).join('');
 show(`<div class="tag">Check-in</div><h3>Check-in fields</h3>${rows}<h4>Add field</h4><input type="text" id="ml" placeholder="e.g. HRV, Skin, Libido"><div class="btns"><select id="mt"><option value="scale">1–5 scale</option><option value="num">Number</option></select><input type="text" id="mu" placeholder="unit" style="width:90px"><button class="bb" onclick="addM()">Add</button></div>${DONE}`,'--c4')}
function mvM(ix,d){const a=ST.cfg.metrics,j=ix+d;if(j<0||j>=a.length)return;[a[ix],a[j]]=[a[j],a[ix]];touchCfg();openMetrics()}
function addM(){const l=$('ml').value.trim();if(!l)return;ST.cfg.metrics.push({id:'m'+nid(),label:l,type:$('mt').value,unit:$('mu').value.trim(),step:'any'});touchCfg();openMetrics()}

function csv(){
 const d=dailyItems(),w=groups('weekly').flatMap(g=>g.items),m=ST.cfg.metrics,q=s=>{s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const head=['date',...d.map(i=>i.label),...w.map(i=>i.label+' (sessions)'),...m.map(x=>x.label+(x.unit?' ('+x.unit+')':'')),'daily completion %','notes'];
 const all=[];for(const k in ST.months)for(const ds in ((ST.months[k]||{}).days||{}))all.push(ds);all.sort();
 const rows=all.map(ds=>{const x=peek(ds)||{},i=x.i||{},mm=x.m||{};return [ds,...d.map(it=>it.type==='num'?(i[it.id]||''):(isDone(it,i[it.id])?1:'')),...w.map(it=>i[it.id]||''),...m.map(z=>mm[z.id]==null?'':mm[z.id]),Math.round(dayPct(ds)*100),x.n||''].map(q).join(',')});
 return [head.map(q).join(','),...rows].join('\n')}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function downloadBackup(){dl('sel-backup-'+today()+'.json',JSON.stringify({app:'sel',v:1,exported:new Date().toISOString(),cfg:ST.cfg,months:ST.months}),'application/json');try{localStorage.setItem('pv-lastbackup',today())}catch(e){}toast('Backup saved to Downloads');render()}
function downloadCSV(){dl('sel-data-'+today()+'.csv',csv(),'text/csv');toast('CSV saved to Downloads')}
function restoreObj(n,how){if(!n||!n.cfg||!n.cfg.groups)throw 0;
 const merge=how==='merge';if(merge){for(const k in (n.months||{})){ST.months[k]=ST.months[k]||{days:{}};const src=n.months[k].days||{};for(const d in src){if(!ST.months[k].days[d])ST.months[k].days[d]=src[d]}}}
 else{ST.cfg=n.cfg;ST.months=n.months||{}}
 migrate(ST.cfg);saveLocal()}
function readBackup(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>{let n;try{n=JSON.parse(r.result);if(!n.cfg)throw 0}catch(e){toast('That file is not a Sel. backup');return}
 const cnt=Object.values(n.months||{}).reduce((a,m)=>a+Object.keys(m.days||{}).length,0);
 show(`<h3>Restore backup</h3><p class="hint">${esc(f.name)} · ${cnt} logged days.</p><div class="btns" style="flex-direction:column"><button class="bb" onclick="doRestore('replace')">Replace everything on this phone</button><button class="bb g" onclick="doRestore('merge')">Add missing days only (keep current practices)</button><button class="bb g" onclick="closeM()">Cancel</button></div>`,'--cx');window._pending=n};r.readAsText(f)}
function doRestore(how){try{restoreObj(window._pending,how);window._pending=null;toast('Restored');closeM()}catch(e){toast('Could not restore that backup')}}
function openCSV(){show(`<h3>Data as CSV</h3><div class="hint">One row per day, ready to paste into a spreadsheet.</div><textarea id="dt" style="min-height:200px;margin:10px 0;font-size:12px" readonly>${esc(csv())}</textarea><div class="btns"><button class="bb" onclick="copyD(this)">Copy</button><button class="bb g" style="flex:1" onclick="closeM()">Done</button></div>`,'--cx')}
function openData(){
 show(`<h3>Backup text</h3><div class="hint">Copy this text to keep it, or paste text exported from the earlier web version and tap Restore. Restore replaces everything on this phone.</div><textarea id="dt" style="min-height:200px;margin:10px 0;font-size:12px">${esc(JSON.stringify({cfg:ST.cfg,months:ST.months}))}</textarea>
 <div class="btns"><button class="bb" onclick="copyD(this)">Copy</button><button class="bb g" onclick="importD()">Restore</button><button class="bb dg" onclick="arm(this,resetCfg)">Reset practices</button></div><p class="hint">Reset restores the default list of practices; your logged history is kept.</p>${DONE}`,'--cx')}
async function copyD(b){const t=$('dt');try{await navigator.clipboard.writeText(t.value);b.textContent='Copied'}catch(e){t.select();try{document.execCommand('copy');b.textContent='Copied'}catch(_){b.textContent='Select & copy manually'}}}
function importD(){try{restoreObj(JSON.parse($('dt').value),'replace');toast('Restored');closeM()}catch(e){$('dt').style.borderColor='var(--c3)';toast('That text is not valid backup data')}}
function resetCfg(){ST.cfg=clone(DEF);touchCfg();toast('Practices reset');closeM()}

{const v=new URLSearchParams(location.search).get('view');if(v&&VIEWS[v]){ui.view=v;history.replaceState(null,'',location.pathname)}}
render();
askPersist();
let newSW=null;
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
 const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){newSW=w;$('upd').classList.add('on')}})};
 if(reg.waiting&&navigator.serviceWorker.controller){newSW=reg.waiting;$('upd').classList.add('on')}
 reg.addEventListener('updatefound',()=>watch(reg.installing));
 setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
}).catch(()=>{})});
 let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload()}})}
function applyUpdate(){if(newSW)newSW.postMessage('skipWaiting');else location.reload()}
let lastSeen=today();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const t=today();if(t!==lastSeen){if(sel===lastSeen)sel=t;lastSeen=t;render()}});
</script>
</body></html>
